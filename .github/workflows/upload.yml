name: Build and Release

permissions: write-all

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          curl -sLO http://ftp.debian.org/debian/pool/main/g/gh/gh_2.46.0-4_amd64.deb
          apt-get install -y sudo git ca-certificates curl
          apt install -y ./gh_2.46.0-4_amd64.deb dpkg-dev make

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build .deb
        run: |
          VERSION=$(date -u +%y%m%d)
          PKG_DIR="lingmo-protocols-${VERSION}"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/share/cosmic-protocols/unstable"
          mkdir -p "${PKG_DIR}/usr/share/pkgconfig"
          printf 'Package: lingmo-protocols\nVersion: %s\nArchitecture: all\nMaintainer: Lingmo OS Team <team@lingmo.org>\nDescription: Lingmo Wayland protocols\nSection: devel\nPriority: optional\n' "$VERSION" > "${PKG_DIR}/DEBIAN/control"
          make PREFIX=/usr DESTDIR="$(pwd)/${PKG_DIR}" install
          dpkg-deb --build "${PKG_DIR}"
          mkdir -p dist
          mv "${PKG_DIR}.deb" dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="build+$(date -u +%y%m%d+%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/*.deb \
            --title "$TAG" \
            --generate-notes